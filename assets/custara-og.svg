<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="ogTitle ogDescription">
  <title id="ogTitle">Custara — Customer Growth Platform</title>
  <desc id="ogDescription">Ubah data customer menjadi repeat revenue.</desc>
  <defs>
    <linearGradient id="ogBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212d"/>
      <stop offset="1" stop-color="#203b42"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0" cy="0" r="1" gradientTransform="translate(1040 115) rotate(135) scale(430)">
      <stop offset="0" stop-color="#58d2c5" stop-opacity=".2"/>
      <stop offset="1" stop-color="#58d2c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ogGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d7f2ee" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#ogBackground)"/>
  <rect width="1200" height="630" fill="url(#ogGrid)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect width="1200" height="12" fill="#0e9b91"/>
  <circle cx="1035" cy="120" r="190" fill="none" stroke="#71d5ca" stroke-opacity=".1" stroke-width="2"/>
  <circle cx="1035" cy="120" r="255" fill="none" stroke="#71d5ca" stroke-opacity=".06" stroke-width="2"/>

  <g transform="translate(84 70) rotate(-9 42 42)">
    <rect x="13" y="13" width="66" height="66" rx="19" fill="none" stroke="#71d5ca" stroke-width="6"/>
    <circle cx="66" cy="65" r="8" fill="#eea04a"/>
  </g>
  <text x="180" y="126" fill="#ffffff" font-family="DM Sans, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-3">Custara</text>
  <text x="184" y="160" fill="#a9c0be" font-family="DM Mono, Consolas, monospace" font-size="14" font-weight="500" letter-spacing="2.4">CUSTOMER GROWTH PLATFORM</text>

  <text x="86" y="295" fill="#ffffff" font-family="DM Sans, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-3">Ubah data customer</text>
  <text x="86" y="366" fill="#ffffff" font-family="DM Sans, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-3">menjadi <tspan fill="#71d5ca">repeat revenue.</tspan></text>
  <rect x="88" y="438" width="268" height="52" rx="26" fill="#0e9b91"/>
  <text x="122" y="472" fill="#ffffff" font-family="DM Sans, Arial, sans-serif" font-size="21" font-weight="600">custara.online</text>
  <text x="86" y="552" fill="#a9c0be" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="500">Customer data • Growth action • Repeat business</text>

  <g transform="translate(844 382)">
    <rect x="0" y="0" width="270" height="120" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#b5e7e0" stroke-opacity=".3"/>
    <text x="25" y="38" fill="#8bdcd3" font-family="DM Mono, Consolas, monospace" font-size="12" letter-spacing="1.8">GROWTH SIGNAL</text>
    <text x="25" y="75" fill="#ffffff" font-family="DM Sans, Arial, sans-serif" font-size="24" font-weight="700">Siap ditindaklanjuti</text>
    <path d="M25 94H170" stroke="#71d5ca" stroke-width="4" stroke-linecap="round"/>
    <path d="M184 94H243" stroke="#eea04a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
