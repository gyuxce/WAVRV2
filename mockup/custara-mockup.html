<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mockup interaktif Custara V1" />
  <title>Custara — Demo Produk</title>
  <link rel="icon" type="image/svg+xml" href="../assets/custara-mark.svg" />
  <link rel="apple-touch-icon" href="../assets/custara-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wavr-ink: #101a2f;
      --wavr-ink-soft: #51617d;
      --wavr-muted: #8c9ab2;
      --wavr-line: #e4e9f2;
      --wavr-surface: #ffffff;
      --wavr-canvas: #f5f7fb;
      --wavr-sidebar: #0e172b;
      --wavr-sidebar-soft: #18243e;
      --wavr-teal: #18b6aa;
      --wavr-blue: #3d7cf6;
      --wavr-purple: #8863e9;
      --wavr-green: #21bd6a;
      --wavr-orange: #f69b22;
      --wavr-red: #ef4965;
      --wavr-yellow: #f1c84b;
      --wavr-shadow: 0 14px 34px rgba(28, 46, 85, 0.08);
      --wavr-radius-lg: 18px;
      --wavr-radius-md: 12px;
      --wavr-radius-sm: 8px;
      --wavr-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--wavr-canvas);
      color: var(--wavr-ink);
      font-family: var(--wavr-font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(61, 124, 246, 0.25);
      outline-offset: 2px;
    }

    .wavr-app { min-height: 100vh; display: flex; }

    .wavr-sidebar {
      background: var(--wavr-sidebar);
      color: #fff;
      width: 252px;
      padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      min-height: 100vh;
      position: sticky;
      top: 0;
      align-self: flex-start;
    }

    .wavr-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px 28px; }
    .wavr-brand-mark {
      width: 38px; height: 38px; border-radius: 12px; background: var(--wavr-teal);
      display: grid; place-items: center; box-shadow: 0 8px 18px rgba(24, 182, 170, 0.24);
      font-weight: 800; letter-spacing: -0.07em; font-size: 15px;
    }
    .wavr-brand-text { display: flex; flex-direction: column; gap: 3px; }
    .wavr-brand-text strong { font-size: 16px; letter-spacing: -0.02em; }
    .wavr-brand-text span { color: #8392af; font-size: 11px; }

    .wavr-nav-label { color: #71809b; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 12px 10px; }
    .wavr-nav { display: grid; gap: 4px; }
    .wavr-nav button {
      border: 0; background: transparent; color: #9daac1; border-radius: 10px; padding: 11px 12px;
      display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; transition: 0.18s ease;
    }
    .wavr-nav button:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .wavr-nav button.is-active { background: var(--wavr-sidebar-soft); color: #fff; box-shadow: inset 3px 0 0 var(--wavr-teal); }
    .wavr-nav button svg { width: 17px; height: 17px; flex-shrink: 0; }
    .wavr-nav button span { flex: 1; }
    .wavr-nav-count { background: rgba(239, 73, 101, 0.18); color: #ff8396; padding: 3px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }

    .wavr-sidebar-bottom { margin-top: auto; display: grid; gap: 14px; }
    .wavr-branch-card { background: #16213a; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 13px; }
    .wavr-branch-card small { color: #8492aa; display: block; font-size: 10px; margin-bottom: 8px; }
    .wavr-branch-card strong { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .wavr-branch-card strong::before { content: ""; width: 7px; height: 7px; background: var(--wavr-green); border-radius: 50%; box-shadow: 0 0 0 3px rgba(33,189,106,0.14); }
    .wavr-user { border-top: 1px solid rgba(255,255,255,0.08); padding: 14px 8px 0; display: flex; align-items: center; gap: 10px; }
    .wavr-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #f0eaff; color: #7652d8; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .wavr-user div { min-width: 0; }
    .wavr-user strong { font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wavr-user span { color: #8492aa; font-size: 10px; }

    .wavr-main { flex: 1; min-width: 0; }
    .wavr-topbar { height: 76px; background: var(--wavr-surface); border-bottom: 1px solid var(--wavr-line); display: flex; align-items: center; justify-content: space-between; padding: 0 34px; gap: 18px; }
    .wavr-breadcrumb { color: var(--wavr-muted); font-size: 12px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .wavr-breadcrumb strong { color: var(--wavr-ink); font-size: 13px; }
    .wavr-topbar-actions { display: flex; align-items: center; gap: 10px; }
    .wavr-demo-launch { margin-right: 2px; }
    .wavr-global-scan { white-space: nowrap; }
    .wavr-icon-button { border: 0; background: transparent; color: var(--wavr-ink-soft); padding: 8px; border-radius: 8px; position: relative; }
    .wavr-icon-button:hover { background: var(--wavr-canvas); color: var(--wavr-ink); }
    .wavr-notification-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--wavr-red); position: absolute; right: 7px; top: 7px; }
    .wavr-top-avatar { display: flex; align-items: center; gap: 9px; border-left: 1px solid var(--wavr-line); padding-left: 16px; }
    .wavr-top-avatar .wavr-avatar { background: #def8ef; color: #1a9670; }
    .wavr-top-avatar strong { display: block; font-size: 12px; }
    .wavr-top-avatar span { display: block; color: var(--wavr-muted); font-size: 10px; margin-top: 2px; }

    .wavr-content { padding: 30px 34px 48px; max-width: 1500px; margin: 0 auto; }
    .wavr-page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 26px; }
    .wavr-page-head h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; line-height: 1.12; }
    .wavr-page-head p { color: var(--wavr-ink-soft); margin: 8px 0 0; }
    .wavr-page-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

    .wavr-button { border: 1px solid var(--wavr-line); background: var(--wavr-surface); color: var(--wavr-ink-soft); border-radius: 9px; padding: 10px 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 12px; transition: 0.18s ease; white-space: nowrap; }
    .wavr-button:hover { border-color: #cbd5e7; transform: translateY(-1px); box-shadow: 0 5px 12px rgba(28,46,85,0.06); }
    .wavr-button.primary { background: var(--wavr-teal); border-color: var(--wavr-teal); color: white; box-shadow: 0 7px 16px rgba(24,182,170,0.2); }
    .wavr-button.primary:hover { background: #12a499; border-color: #12a499; }
    .wavr-button.dark { background: var(--wavr-ink); color: white; border-color: var(--wavr-ink); }
    .wavr-button.danger { color: var(--wavr-red); }
    .wavr-button.small { padding: 7px 10px; font-size: 11px; }
    .wavr-button svg { width: 15px; height: 15px; }

    .wavr-kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
    .wavr-kpi { background: var(--wavr-surface); border: 1px solid var(--wavr-line); border-radius: var(--wavr-radius-md); padding: 18px; box-shadow: 0 4px 14px rgba(28,46,85,0.03); }
    .wavr-kpi-top { display: flex; justify-content: space-between; align-items: center; color: var(--wavr-ink-soft); font-size: 12px; }
    .wavr-kpi-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
    .wavr-kpi-icon.blue { color: var(--wavr-blue); background: #e8f0ff; }
    .wavr-kpi-icon.teal { color: var(--wavr-teal); background: #e6fbf7; }
    .wavr-kpi-icon.purple { color: var(--wavr-purple); background: #f0ebff; }
    .wavr-kpi-icon.orange { color: var(--wavr-orange); background: #fff4df; }
    .wavr-kpi-value { font-size: 27px; letter-spacing: -0.04em; font-weight: 800; margin: 18px 0 7px; }
    .wavr-kpi-foot { display: flex; align-items: center; gap: 7px; color: var(--wavr-ink-soft); font-size: 11px; }
    .wavr-kpi-foot strong { color: var(--wavr-green); }

    .wavr-grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.85fr); gap: 18px; margin-bottom: 22px; }
    .wavr-panel { background: var(--wavr-surface); border: 1px solid var(--wavr-line); border-radius: var(--wavr-radius-lg); padding: 21px; box-shadow: 0 4px 14px rgba(28,46,85,0.03); min-width: 0; }
    .wavr-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 18px; }
    .wavr-panel-head h2 { margin: 0; font-size: 15px; letter-spacing: -0.02em; }
    .wavr-panel-head p { margin: 5px 0 0; color: var(--wavr-muted); font-size: 11px; }
    .wavr-link-button { border: 0; background: transparent; color: var(--wavr-teal); padding: 0; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .wavr-link-button:hover { color: #0e8f85; text-decoration: underline; }

    .wavr-opportunity-list { display: grid; gap: 10px; }
    .wavr-opportunity { border: 1px solid var(--wavr-line); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 13px; }
    .wavr-opportunity:hover { border-color: #cbd5e7; background: #fbfcff; }
    .wavr-opportunity-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
    .wavr-opportunity-icon.red { color: var(--wavr-red); background: #ffebef; }
    .wavr-opportunity-icon.orange { color: #d98400; background: #fff2d8; }
    .wavr-opportunity-icon.purple { color: var(--wavr-purple); background: #f0ebff; }
    .wavr-opportunity-main { min-width: 0; flex: 1; }
    .wavr-opportunity-main strong { display: block; font-size: 12px; margin-bottom: 4px; }
    .wavr-opportunity-main span { color: var(--wavr-ink-soft); font-size: 11px; }
    .wavr-opportunity-value { text-align: right; white-space: nowrap; }
    .wavr-opportunity-value strong { display: block; font-size: 13px; }
    .wavr-opportunity-value span { color: var(--wavr-muted); font-size: 10px; }

    .wavr-health-list { display: grid; gap: 15px; }
    .wavr-health-row { display: flex; align-items: center; gap: 12px; }
    .wavr-health-row svg { width: 16px; height: 16px; color: var(--wavr-teal); flex-shrink: 0; }
    .wavr-health-row div { flex: 1; min-width: 0; }
    .wavr-health-row strong { display: block; font-size: 12px; }
    .wavr-health-row span { color: var(--wavr-muted); font-size: 10px; }
    .wavr-status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 8px; font-weight: 700; font-size: 10px; white-space: nowrap; }
    .wavr-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .wavr-status.success { color: #15935b; background: #e7faf0; }
    .wavr-status.warning { color: #b67900; background: #fff5dc; }
    .wavr-status.danger { color: #d92f4d; background: #ffedf1; }
    .wavr-status.neutral { color: #63728f; background: #eef2f8; }

    .wavr-activity-table, .wavr-data-table { width: 100%; border-collapse: collapse; }
    .wavr-activity-table th, .wavr-data-table th { color: var(--wavr-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; text-align: left; font-weight: 700; padding: 0 12px 11px; border-bottom: 1px solid var(--wavr-line); }
    .wavr-activity-table td, .wavr-data-table td { padding: 13px 12px; border-bottom: 1px solid #edf0f5; vertical-align: middle; font-size: 12px; }
    .wavr-activity-table td:first-child, .wavr-activity-table th:first-child, .wavr-data-table td:first-child, .wavr-data-table th:first-child { padding-left: 0; }
    .wavr-activity-table td:last-child, .wavr-activity-table th:last-child, .wavr-data-table td:last-child, .wavr-data-table th:last-child { padding-right: 0; }
    .wavr-table-person { display: flex; align-items: center; gap: 9px; }
    .wavr-table-person .wavr-avatar { width: 27px; height: 27px; font-size: 10px; }
    .wavr-table-person strong { display: block; font-size: 12px; }
    .wavr-table-person span { color: var(--wavr-muted); font-size: 10px; display: block; margin-top: 2px; }
    .wavr-text-right { text-align: right; }
    .wavr-text-muted { color: var(--wavr-muted); }
    .wavr-text-soft { color: var(--wavr-ink-soft); }
    .wavr-table-wrap { overflow-x: auto; }

    .wavr-search-bar { display: flex; gap: 10px; margin-bottom: 18px; }
    .wavr-search-input { position: relative; flex: 1; min-width: 180px; }
    .wavr-search-input svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--wavr-muted); width: 16px; height: 16px; }
    .wavr-input, .wavr-select { width: 100%; border: 1px solid var(--wavr-line); background: var(--wavr-surface); color: var(--wavr-ink); border-radius: 9px; padding: 10px 12px; }
    .wavr-search-input .wavr-input { padding-left: 38px; }
    .wavr-select { appearance: auto; }

    .wavr-avatar-stack { display: flex; align-items: center; }
    .wavr-avatar-stack .wavr-avatar { border: 2px solid #fff; margin-left: -7px; width: 27px; height: 27px; font-size: 10px; }
    .wavr-avatar-stack .wavr-avatar:first-child { margin-left: 0; }
    .wavr-avatar-more { color: var(--wavr-ink-soft); background: #eef2f7; }

    .wavr-segment-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .wavr-segment-card { border: 1px solid var(--wavr-line); border-radius: 13px; padding: 16px; }
    .wavr-segment-card .wavr-segment-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 14px; }
    .wavr-segment-card h3 { margin: 0 0 5px; font-size: 13px; }
    .wavr-segment-card p { margin: 0 0 14px; font-size: 11px; color: var(--wavr-ink-soft); min-height: 30px; }
    .wavr-segment-meta { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--wavr-line); }
    .wavr-segment-meta strong { font-size: 17px; }
    .wavr-segment-meta span { font-size: 10px; color: var(--wavr-muted); }

    .wavr-tier-list { display: grid; gap: 10px; }
    .wavr-tier { display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #edf0f5; padding: 12px 0; }
    .wavr-tier:first-child { padding-top: 0; }
    .wavr-tier:last-child { border-bottom: 0; padding-bottom: 0; }
    .wavr-tier-mark { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .wavr-tier:nth-child(1) .wavr-tier-mark { background: #eef2f8; color: #75829a; }
    .wavr-tier:nth-child(2) .wavr-tier-mark { background: #e8f0ff; color: var(--wavr-blue); }
    .wavr-tier:nth-child(3) .wavr-tier-mark { background: #fff0d5; color: #b87300; }
    .wavr-tier div { flex: 1; }
    .wavr-tier strong { display: block; font-size: 12px; }
    .wavr-tier span { color: var(--wavr-muted); font-size: 10px; }
    .wavr-tier b { font-size: 12px; }

    .wavr-modal-backdrop { position: fixed; inset: 0; background: rgba(9, 17, 34, 0.44); display: grid; place-items: center; padding: 24px; z-index: 10; }
    .wavr-modal-backdrop[hidden] { display: none; }
    .wavr-modal { width: min(100%, 570px); background: var(--wavr-surface); border-radius: 18px; box-shadow: 0 24px 60px rgba(7,17,39,0.25); overflow: hidden; max-height: min(760px, calc(100vh - 48px)); display: flex; flex-direction: column; }
    .wavr-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 22px 24px 16px; border-bottom: 1px solid var(--wavr-line); }
    .wavr-modal-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.03em; }
    .wavr-modal-head p { margin: 6px 0 0; color: var(--wavr-ink-soft); font-size: 11px; }
    .wavr-modal-close { border: 0; background: #f1f4f8; color: var(--wavr-ink-soft); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
    .wavr-modal-body { padding: 21px 24px; overflow-y: auto; }
    .wavr-modal-foot { padding: 15px 24px 22px; border-top: 1px solid var(--wavr-line); display: flex; justify-content: flex-end; gap: 10px; }
    .wavr-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .wavr-form-field { display: grid; gap: 7px; }
    .wavr-form-field.full { grid-column: 1 / -1; }
    .wavr-form-field label { font-size: 11px; color: var(--wavr-ink-soft); font-weight: 700; }
    .wavr-form-field small { color: var(--wavr-muted); font-size: 10px; }
    .wavr-checkbox { display: flex; gap: 9px; align-items: flex-start; font-size: 11px; color: var(--wavr-ink-soft); line-height: 1.4; }
    .wavr-checkbox input { margin-top: 2px; accent-color: var(--wavr-teal); }

    .wavr-profile-hero { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--wavr-line); }
    .wavr-profile-hero .wavr-avatar { width: 48px; height: 48px; font-size: 15px; }
    .wavr-profile-hero h3 { margin: 0 0 4px; font-size: 16px; }
    .wavr-profile-hero p { color: var(--wavr-ink-soft); margin: 0; font-size: 11px; }
    .wavr-profile-status { margin-left: auto; align-self: flex-start; }
    .wavr-profile-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 18px 0; }
    .wavr-profile-stat { background: #f7f9fc; border-radius: 10px; padding: 11px; }
    .wavr-profile-stat strong { display: block; font-size: 15px; margin-bottom: 4px; }
    .wavr-profile-stat span { color: var(--wavr-muted); font-size: 10px; }
    .wavr-profile-section { padding-top: 13px; }
    .wavr-profile-section h4 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--wavr-muted); }
    .wavr-chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .wavr-chip { background: #effaf7; color: #0e8f85; border-radius: 999px; padding: 5px 8px; font-size: 10px; font-weight: 700; }
    .wavr-chip.neutral { background: #eef2f7; color: var(--wavr-ink-soft); }

    .wavr-toast { position: fixed; right: 25px; bottom: 25px; background: var(--wavr-ink); color: #fff; padding: 13px 16px; border-radius: 10px; box-shadow: var(--wavr-shadow); display: flex; align-items: center; gap: 9px; z-index: 20; transform: translateY(20px); opacity: 0; pointer-events: none; transition: 0.22s ease; font-size: 12px; }
    .wavr-toast.is-visible { transform: translateY(0); opacity: 1; }
    .wavr-toast svg { color: #6fe4bd; }

    .wavr-empty { padding: 42px 18px; text-align: center; color: var(--wavr-muted); }
    .wavr-empty svg { color: #bcc7d7; width: 30px; height: 30px; margin-bottom: 8px; }
    .wavr-empty strong { color: var(--wavr-ink-soft); display: block; margin-bottom: 4px; }
    .wavr-notice { background: #effaf7; border: 1px solid #c8f1e5; border-radius: 10px; padding: 11px 13px; color: #137f73; font-size: 11px; margin-bottom: 16px; display: flex; gap: 8px; align-items: flex-start; }
    .wavr-notice svg { flex-shrink: 0; margin-top: 1px; }
    .wavr-demo-bar { background: linear-gradient(135deg, #101a2f 0%, #182849 100%); color: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 22px; display: grid; grid-template-columns: minmax(190px, .7fr) minmax(300px, 1.3fr) auto; gap: 18px; align-items: center; box-shadow: 0 12px 26px rgba(16, 26, 47, .16); }
    .wavr-demo-kicker { color: #6fe4bd; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 5px; }

      const campaign = appState.campaigns.find(item => item.id === campaignId) || appState.campaigns[0];
      openModal(campaign.name, `${campaign.segment} · ${campaign.audience} customer`, `<div class="wavr-notice">${icon("spark", 16)}<span>Action ini akan mengirim <strong>${campaign.channel}</strong> setelah kamu approve. Audience snapshot akan dikunci untuk attribution.</span></div><div class="wavr-profile-section"><h4>Trigger reason</h4><p class="wavr-text-soft" style="margin:0;font-size:12px;line-height:1.5">Customer berada dalam segment <strong>${campaign.segment}</strong> berdasarkan behavior data yang berhasil dievaluasi pada 09 Aug 2026 pukul 09:35.</p></div><div class="wavr-profile-section"><h4>Execution checklist</h4><div class="wavr-health-list"><div class="wavr-health-row">${icon("check-circle", 16)}<div><strong>Audience snapshot</strong><span>${campaign.audience} eligible customers</span></div>${status("Ready")}</div><div class="wavr-health-row">${icon("message", 16)}<div><strong>Outbound channel</strong><span>${campaign.channel} provider</span></div>${status("Connected")}</div><div class="wavr-health-row">${icon("trend", 16)}<div><strong>Attribution window</strong><span>30 days after send</span></div>${status("Configured")}</div></div></div>`, `<button type="button" class="wavr-button" data-action="close-modal">Cancel</button><button type="button" class="wavr-button primary" data-action="approve-campaign" data-campaign="${campaign.id}"><span data-icon-name="check"></span>Approve & queue</button>`);
    }

    function saveCustomer() {
      const form = document.getElementById("newCustomerForm");
      if (!form.reportValidity()) return;
      const formData = new FormData(form);
      const name = formData.get("name").trim();
      const newCustomer = { id: `c-${String(appState.customers.length + 1).padStart(3, "0")}`, name, phone: formData.get("phone").trim(), initials: initials(name), lastVisit: "Belum ada visit", visits: 0, spend: 0, points: 0, tier: "Bronze", identifier: formData.get("identifier").trim().toUpperCase(), segment: "New customer", consent: formData.get("consent") === "on" };
      if (appState.customers.some(customer => customer.identifier === newCustomer.identifier)) { showToast("Identifier sudah terpakai di tenant ini"); return; }
      appState.customers.unshift(newCustomer);
      closeModal(); renderPage("customers"); showToast(`${name} berhasil ditambahkan`);
    }

    function saveTransaction() {
      const form = document.getElementById("newTransactionForm");
      if (!form.reportValidity()) return;
      const customer = customerById(document.getElementById("txCustomer").value);
      const amount = Number(document.getElementById("txAmount").value.replace(/[^0-9]/g, ""));
      if (!amount || amount < 0) { showToast("Masukkan amount yang valid"); return; }
      const tx = { id: `TX-${24100 + appState.transactions.length}`, customerId: customer.id, service: document.getElementById("txService").value, date: "09 Aug 2026 · just now", amount, status: "Recorded", source: "Manual" };
      appState.transactions.unshift(tx);
      customer.visits += 1; customer.spend += amount; customer.lastVisit = "Hari ini, baru saja"; customer.points += Math.floor(amount / 10000);
      closeModal(); renderPage("transactions"); showToast(`${formatIDR(amount)} tercatat dan points dibuat`);
    }

    function resolveIdentifier() {
      const value = document.getElementById("scanIdentifier").value.trim().toUpperCase();
      const customer = appState.customers.find(item => item.identifier === value);
      const error = document.getElementById("scanError");
      if (value === "RFID-REVOKED") { error.querySelector("span").textContent = "ID pengenal sudah dicabut. Pulihkan ID atau pilih alur pemulihan manual."; error.hidden = false; return; }
      if (!customer) { error.querySelector("span").textContent = "ID pengenal tidak dikenal. Custara tidak membuat pelanggan otomatis; periksa nilainya atau pilih Tambah pelanggan."; error.hidden = false; return; }
      closeModal(); openCustomerModal(customer.id);
    }

    function handleAction(actionTarget) {
      const action = actionTarget.dataset.action;
      if (!action) return;
      if (action === "close-modal") closeModal();
      if (action === "scan") openScanModal();
      if (action === "add-customer") openNewCustomerModal();
      if (action === "add-transaction") openTransactionModal();
      if (action === "import-csv") openImportModal();
      if (action === "resolve-identifier") resolveIdentifier();
      if (action === "save-customer") saveCustomer();
      if (action === "save-transaction") saveTransaction();
      if (action === "view-customer") openCustomerModal(actionTarget.dataset.customer);
      if (action === "create-visit") { const customer = customerById(actionTarget.dataset.customer); closeModal(); showToast(`Visit baru dibuat untuk ${customer.name}`); }
      if (action === "run-campaign") openCampaignModal(actionTarget.dataset.campaign);
      if (action === "approve-campaign") { const campaign = appState.campaigns.find(item => item.id === actionTarget.dataset.campaign); campaign.status = "Queued"; campaign.lastRun = "Queued just now"; closeModal(); renderPage("campaigns"); showToast(`${campaign.name} masuk queue untuk ${campaign.channel}`); }
      if (action === "focus-search") { renderPage("customers"); setTimeout(() => document.getElementById("customerSearch")?.focus(), 0); }
      if (action === "new-campaign") { showToast("Campaign builder akan tersedia setelah golden path pilot tervalidasi"); }
      if (action === "new-segment") { showToast("Segment baru memakai rule sederhana di V1"); }
      if (action === "add-reward") { showToast("Reward definition siap ditambahkan di konfigurasi loyalty"); }
      if (action === "manage-tiers") { showToast("Tier thresholds dikelola oleh Product + Client"); }
      if (action === "integration-test") { showToast("Connection test berhasil — all systems healthy"); }
      if (action === "invite-user") { showToast("Invite user dibatasi ke tenant aktif"); }
      if (action === "save-settings") { showToast("Settings saved untuk Senopati branch"); }
    }

    document.addEventListener("click", event => {
      const navButton = event.target.closest("#mainNav button[data-page]");
      if (navButton) { renderPage(navButton.dataset.page); return; }
      const pageLink = event.target.closest("[data-page-link]");
      if (pageLink) { renderPage(pageLink.dataset.pageLink); return; }
      const actionTarget = event.target.closest("[data-action]");
      if (actionTarget) { handleAction(actionTarget); return; }
      if (event.target.id === "modalBackdrop") closeModal();
    });

    document.addEventListener("input", event => {
      if (event.target.id === "customerSearch") filterCustomers();
      if (event.target.id === "transactionSearch") filterTransactions();
    });
    document.addEventListener("change", event => { if (event.target.id === "customerSegmentFilter") filterCustomers(); });

    function filterCustomers() {
      const query = (document.getElementById("customerSearch")?.value || "").toLowerCase();
      const segment = document.getElementById("customerSegmentFilter")?.value || "all";
      const filtered = appState.customers.filter(customer => [customer.name, customer.phone, customer.identifier].join(" ").toLowerCase().includes(query) && (segment === "all" || customer.segment === segment));
      const tbody = document.getElementById("customerTableBody");
      if (!tbody) return;
      tbody.innerHTML = filtered.length ? filtered.map(customer => `<tr><td><div class="wavr-table-person">${avatar(customer)}<div><strong>${customer.name}</strong><span>${customer.phone}</span></div></div></td><td><span class="wavr-chip neutral">${customer.identifier}</span></td><td class="wavr-text-soft">${customer.lastVisit}</td><td class="wavr-text-soft">${customer.visits}</td><td><strong>${formatIDR(customer.spend)}</strong></td><td>${status(customer.tier)}</td><td><button type="button" class="wavr-button small" data-action="view-customer" data-customer="${customer.id}">View profile ${icon("arrow", 12)}</button></td></tr>`).join("") : `<tr><td colspan="7"><div class="wavr-empty">${icon("search", 30)}<strong>No customer found</strong>Try a different name, phone, or identifier.</div></td></tr>`;
    }

    function filterTransactions() {
      const query = (document.getElementById("transactionSearch")?.value || "").toLowerCase();
      const filtered = appState.transactions.filter(tx => { const customer = customerById(tx.customerId); return [tx.id, tx.service, customer.name].join(" ").toLowerCase().includes(query); });
      const tbody = document.getElementById("transactionTableBody");
      if (!tbody) return;
      tbody.innerHTML = filtered.length ? filtered.map(transactionRow).join("") : `<tr><td colspan="5"><div class="wavr-empty">${icon("search", 30)}<strong>No transaction found</strong>Try a different customer, service, or id.</div></td></tr>`;
    }

    function campaignAudienceCount(segment) {
      return { "Inactive >60d": 86, "High value": 38, "Near tier": 24, "Frequent visitor": 112, "Service cross-sell": 42, "Birthday this month": 17 }[segment] || appState.customers.filter(customer => customer.segment === segment).length;
    }

    function openCustomerModal(customerId) {
      const customer = customerById(customerId);

    function saveCustomer() {
      const form = document.getElementById("newCustomerForm");
      if (!form.reportValidity()) return;
      const formData = new FormData(form);
      const name = formData.get("name").trim();
      const phone = formData.get("phone").trim();
      const identifier = formData.get("identifier").trim().toUpperCase();
      const error = document.getElementById("newCustomerError");
      const fail = message => { error.querySelector("span").textContent = message; error.hidden = false; };
      if (formData.get("consent") !== "on") { fail("Persetujuan wajib sebelum profil pelanggan dapat disimpan."); return; }
      if (appState.customers.some(customer => customer.identifier === identifier)) { fail("ID pengenal sudah terpakai di tenant ini. Gunakan ID lain atau buka profil yang sudah ada."); return; }
      if (appState.customers.some(customer => customer.phone === phone)) { fail("Nomor telepon sudah terhubung ke pelanggan lain. Periksa kemungkinan duplikat sebelum membuat profil baru."); return; }
      const newCustomer = { id: `c-${String(appState.customers.length + 1).padStart(3, "0")}`, name, phone, initials: initials(name), lastVisit: "Belum ada visit", visits: 0, spend: 0, points: 0, tier: "Bronze", identifier, segment: "New customer", consent: true };
      appState.customers.unshift(newCustomer);
      closeModal();
      renderPage("customers");
      showToast(`${name} berhasil ditambahkan`);
    }

    function saveTransaction() {
      const form = document.getElementById("newTransactionForm");
      if (!form.reportValidity()) return;
      const customer = customerById(document.getElementById("txCustomer").value);
      const amount = Number(document.getElementById("txAmount").value.replace(/[^0-9]/g, ""));
      if (!amount || amount < 0) { showToast("Masukkan amount yang valid"); return; }
      const tx = { id: `TX-${24100 + appState.transactions.length}`, customerId: customer.id, service: document.getElementById("txService").value, date: "09 Aug 2026 · just now", amount, status: "Recorded", source: "Manual" };
      appState.transactions.unshift(tx);
      appState.visits.unshift({ id: `VIS-${8812 + appState.visits.length}`, customerId: customer.id, date: "09 Aug 2026 · just now", source: "Manual transaction", branch: "Senopati" });
      customer.visits += 1;
      customer.spend += amount;
      customer.lastVisit = "Hari ini, baru saja";
      customer.points += Math.floor(amount / 10000);
      closeModal();
      renderPage("transactions");
      showToast(`${formatIDR(amount)} tercatat dan poin dibuat`);
    }

      openModal(campaign.name, `${campaign.segment} · ${campaign.audience} customer`, `<div class="wavr-notice">${icon("spark", 16)}<span>Action ini akan mengirim <strong>${campaign.channel}</strong> setelah kamu approve. Audience snapshot akan dikunci untuk attribution.</span></div><div class="wavr-profile-section"><h4>Trigger reason</h4><p class="wavr-text-soft" style="margin:0;font-size:12px;line-height:1.5">Customer berada dalam segment <strong>${campaign.segment}</strong> berdasarkan behavior data yang berhasil dievaluasi pada 09 Aug 2026 pukul 09:35.</p></div><div class="wavr-profile-section"><h4>Audience preview</h4><div class="wavr-table-wrap"><table class="wavr-data-table"><thead><tr><th>Customer</th><th>Phone</th><th class="wavr-text-right">Tier</th></tr></thead><tbody>${campaignAudienceRows(campaign)}</tbody></table></div><p class="wavr-result-note">${remaining ? `+${remaining} customer lain tersimpan di audience snapshot.` : "Semua profile yang matching terlihat di preview."}</p></div><div class="wavr-profile-section"><h4>Execution checklist</h4><div class="wavr-health-list"><div class="wavr-health-row">${icon("check-circle", 16)}<div><strong>Audience snapshot</strong><span>${campaign.audience} eligible customers</span></div>${status("Ready")}</div><div class="wavr-health-row">${icon("message", 16)}<div><strong>Outbound channel</strong><span>${campaign.channel} provider</span></div>${status("Connected")}</div><div class="wavr-health-row">${icon("trend", 16)}<div><strong>Attribution window</strong><span>30 days after send</span></div>${status("Configured")}</div></div></div>${resultBlock}`, foot);

    function handleAction(actionTarget) {
      const action = actionTarget.dataset.action;
      if (!action) return;
      if (action === "close-modal") closeModal();
      if (action === "scan") openScanModal();
      if (action === "add-customer") openNewCustomerModal();
      if (action === "add-transaction") openTransactionModal();
      if (action === "resolve-identifier") resolveIdentifier();
      if (action === "save-customer") saveCustomer();
      if (action === "save-transaction") saveTransaction();
      if (action === "save-visit") saveVisit(actionTarget.dataset.customer);
      if (action === "save-campaign") saveCampaign();
      if (action === "view-customer") openCustomerModal(actionTarget.dataset.customer);
      if (action === "create-visit") openVisitModal(actionTarget.dataset.customer);
      if (action === "run-campaign") openCampaignModal(actionTarget.dataset.campaign);
      if (action === "approve-campaign") { const campaign = appState.campaigns.find(item => item.id === actionTarget.dataset.campaign); campaign.status = "Queued"; campaign.lastRun = "Baru saja masuk antrean"; closeModal(); renderPage("campaigns"); showToast(`${campaign.name} masuk antrean untuk ${uiLabel(campaign.channel)}`); }
      if (action === "view-attribution") showToast("Hasil atribusi sudah tersedia di proses kampanye ini");
      if (action === "view-campaign-runs") openCampaignModal(appState.campaigns.find(item => item.status === "Queued")?.id || appState.campaigns[0].id);
      if (action === "focus-search") { renderPage("customers"); setTimeout(() => document.getElementById("customerSearch")?.focus(), 0); }
      if (action === "new-campaign") openNewCampaignModal();
      if (action === "new-segment") showToast("Segmen baru memakai aturan sederhana di V1");
      if (action === "add-reward") showToast("Definisi reward siap ditambahkan di konfigurasi loyalitas");
      if (action === "manage-tiers") showToast("Ambang tingkat dikelola oleh tim produk dan klien");
      if (action === "integration-test") showToast("Uji koneksi berhasil - semua sistem sehat");
      if (action === "invite-user") showToast("Undangan pengguna dibatasi ke tenant aktif");
      if (action === "save-settings") showToast("Pengaturan tersimpan untuk cabang Senopati");
    }

    function resetDemoData(keepActive = true) {
      appState.customers = appState.customers.filter(customer => customer.id !== "c-demo");

      appState.visits = appState.visits.filter(visit => !visit.id.startsWith("VIS-DEMO"));
      const demoCampaign = appState.campaigns.find(campaign => campaign.id === "cmp-1");
      if (demoCampaign) { demoCampaign.status = "Ready"; demoCampaign.lastRun = "Belum pernah"; }
      appState.campaignMetrics = { sent: 152, returned: 28, attributedRevenue: 18400000, conversion: 18.7 };
      appState.demo = { active: keepActive, stepIndex: 0, progress: [] };
    }

    function ensureDemoCustomer() {
      let customer = customerById("c-demo");
      if (!customer) {
        customer = { id: "c-demo", name: "Nadia Demo", phone: "+62 811 0000 0001", initials: "ND", lastVisit: "Belum ada kunjungan", visits: 0, spend: 0, points: 0, tier: "Bronze", identifier: "DEMO-0001", segment: "New customer", consent: true };
        appState.customers.unshift(customer);
      }
      return customer;
    }

    function runDemoStep(stepId) {
      const customer = ensureDemoCustomer();
      if (stepId === "register") { appState.page = "customers"; showToast("Berhasil: profil Nadia Demo dan persetujuan tersimpan"); return "customers"; }
      if (stepId === "identify") { appState.page = "customers"; showToast("Berhasil: DEMO-0001 dipindai dan profil Nadia Demo ditemukan"); return "customers"; }
      if (stepId === "transaction") {
        if (!appState.transactions.some(transaction => transaction.id === "TX-DEMO-1")) {
          appState.transactions.unshift({ id: "TX-DEMO-1", customerId: customer.id, service: "Laser Glow", date: "09 Agu 2026 · baru saja", amount: 1850000, status: "Recorded", source: "Manual" });
          appState.visits.unshift({ id: "VIS-DEMO-1", customerId: customer.id, date: "09 Agu 2026 · baru saja", source: "Manual front desk", branch: "Senopati" });
          customer.visits = 1; customer.spend = 1850000; customer.points = 185; customer.lastVisit = "Hari ini, baru saja";
        }
        showToast("Berhasil: transaksi Rp 1.850.000 tercatat dan 185 poin dibuat"); return "transactions";

    function handleAction(actionTarget) {
      const action = actionTarget.dataset.action;
      if (!action) return;
      if (action === "start-demo") { if (appState.demo.active) { appState.demo.active = false; renderPage(appState.page); showToast("Mode demo ditutup"); } else startDemo(); }
      if (action === "demo-next") advanceDemo();
      if (action === "demo-reset") { resetDemoData(true); renderPage(appState.page); showToast("Data demo dikembalikan ke kondisi awal"); }
      if (action === "demo-scan-error") simulateDemoScanError();
      if (action === "demo-provider-error") simulateDemoProviderError();
      if (action === "close-modal") closeModal();
      if (action === "scan") openScanModal();
      if (action === "add-customer") openNewCustomerModal();
      if (action === "add-transaction") openTransactionModal();
      if (action === "resolve-identifier") resolveIdentifier();
      if (action === "save-customer") saveCustomer();
      if (action === "save-transaction") saveTransaction();
      if (action === "save-visit") saveVisit(actionTarget.dataset.customer);
      if (action === "save-campaign") saveCampaign();
      if (action === "save-reward") saveReward();
      if (action === "confirm-import") confirmImport();
      if (action === "open-segment") openSegmentModal(actionTarget.dataset.segment);
      if (action === "use-segment") { const segmentName = actionTarget.dataset.segment; closeModal(); renderPage("campaigns"); showToast(`Audiens ${segmentName} siap dipakai untuk kampanye`); }
      if (action === "import-csv") openImportModal();
      if (action === "view-customer") openCustomerModal(actionTarget.dataset.customer);
      if (action === "create-visit") openVisitModal(actionTarget.dataset.customer);
      if (action === "run-campaign") openCampaignModal(actionTarget.dataset.campaign);
      if (action === "approve-campaign") { const campaign = appState.campaigns.find(item => item.id === actionTarget.dataset.campaign); campaign.status = "Queued"; campaign.lastRun = "Baru saja masuk antrean"; closeModal(); renderPage("campaigns"); showToast(`${campaign.name} masuk antrean untuk ${uiLabel(campaign.channel)}`); }

      if (action === "view-campaign-runs") openCampaignModal(appState.campaigns.find(item => item.status === "Queued")?.id || appState.campaigns[0].id);
      if (action === "focus-search") { renderPage("customers"); setTimeout(() => document.getElementById("customerSearch")?.focus(), 0); }
      if (action === "new-campaign") openNewCampaignModal();
      if (action === "new-segment") showToast("Segmen baru memakai aturan sederhana di V1");

      if (action === "save-settings") showToast("Pengaturan tersimpan untuk cabang Senopati");
      if (action === "export-ledger") showToast("Ledger poin demo siap diekspor sebagai CSV");
      if (action === "retry-provider") { closeModal(); showToast("Percobaan ulang berhasil - pesan masuk antrean"); }
    }

    renderPage("overview");

        </div>
        <section class="wavr-panel"><div class="wavr-panel-head"><div><h2>Aktivitas terbaru</h2><p>Kunjungan dan layanan pelanggan yang baru tercatat.</p></div><button type="button" class="wavr-link-button" data-page-link="transactions">Lihat aktivitas ${icon("arrow", 13)}</button></div><div class="wavr-table-wrap"><table class="wavr-activity-table"><thead><tr><th>Pelanggan</th><th>Layanan</th><th>Status</th><th class="wavr-text-right">Nilai</th></tr></thead><tbody>${activityRows}</tbody></table></div></section>`;
      return renderShellPage("Selamat pagi, Andra", "Cabang Senopati · Sabtu, 09 Agustus 2026", actions, body);
    }

    function renderSegments() {
      const actions = `<button type="button" class="wavr-button" data-action="evaluate-segments"><span data-icon-name="clock"></span>Evaluasi sekarang</button><button type="button" class="wavr-button primary" data-action="new-segment"><span data-icon-name="plus"></span>Segmen baru</button>`;
      const segments = [
        ["01", "REAKTIVASI", "Tidak aktif >60 hari", "Pelanggan yang belum kembali dalam 60 hari terakhir.", 86, "Rp 42,8jt"],
        ["02", "NILAI PELANGGAN", "Nilai tinggi", "Pelanggan dengan kontribusi belanja paling besar.", 38, "Rp 31,4jt"],
        ["03", "LOYALITAS", "Hampir naik tingkat", "Pelanggan yang tinggal sedikit lagi menuju tingkat berikutnya.", 24, "Rp 8,6jt"],
        ["04", "KEBIASAAN", "Sering berkunjung", "Pelanggan dengan tiga kunjungan atau lebih dalam 90 hari.", 112, "Rp 27,9jt"],
        ["05", "LAYANAN", "Peluang lintas layanan", "Pelanggan konsultasi yang siap menerima rekomendasi layanan lanjutan.", 42, "Rp 13,2jt"],
        ["06", "MOMEN", "Ulang tahun bulan ini", "Audiens ulang tahun dengan persetujuan komunikasi aktif.", 17, "Rp 4,1jt"]
      ];
      const segmentIcons = ["users", "trend", "gift", "users", "message", "gift"];
      const cards = segments.map(([index, label, name, description, count, value], position) => `<button type="button" class="wavr-segment-card" data-action="open-segment" data-segment="${name}"><span class="wavr-segment-index">${index}</span><span class="wavr-segment-top"><span class="wavr-segment-icon">${icon(segmentIcons[position], 16)}</span><span class="wavr-segment-label">${label}</span></span><h3>${name}</h3><p>${description}</p><span class="wavr-segment-meta"><span><strong>${count}</strong> pelanggan</span><span>${value} potensi ${icon("arrow", 12)}</span></span></button>`).join("");
      const body = `<section class="wavr-panel wavr-segments-panel"><div class="wavr-panel-head"><div><h2>Segmen berbasis aturan</h2><p>Pilih segmen untuk melihat audiens dan lanjutkan menjadi aksi yang lebih relevan.</p></div><span class="wavr-status success">Terakhir dievaluasi 8 menit lalu</span></div><div class="wavr-segment-grid">${cards}</div></section>`;
      return renderShellPage("Segmen", "Ubah perilaku menjadi audiens yang dapat ditindaklanjuti tim pertumbuhan.", actions, body);
    }

    renderPage(appState.page);
  </script>
</body>
